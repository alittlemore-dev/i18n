name: Backend tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    timeout-minutes: 60
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: "Install UV"
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: "backend-tests"
      - name: "Run backend tests with coverage"
        run: make tests-coverage
      - name: "Coverage Badge"
        run: |
          python -m pip install genbadge==1.1.3 defusedxml==0.7.1
          genbadge coverage -n backend -i coverage.xml -o .github/badges/coverage-backend.svg
      - name: "Upload coverage badge"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-coverage-badge-${{ github.sha }}
          path: .github/badges/coverage-backend.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: "Build service image"
        run: make build
      - name: "Verify container runtime"
        run: make test-container
